name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Worker types
        run: npx wrangler types

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://glow-by-rishi-api.one43sanju.workers.dev/api/health)
          echo "API health status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
          # Once api.glowbyrishi.in is added as a Cloudflare zone and the
          # custom domain route is re-enabled in wrangler.jsonc, switch this
          # health check back to https://api.glowbyrishi.in/api/health
